<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 372" width="1250" height="372" role="img" aria-label="Animated pipeline: input enters a platform kickoff form; a Python use case embeds files into a knowledge base; input guardrails check for secrets and prompt injection; agents process the task with retrieval; an evaluator agent checks output against rules and sends failures back for up to three retries; output guardrails check toxicity and secrets; results go back to the platform through Azure Service Bus; Application Insights collects logs and traces from every stage.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff5fa"/><stop offset="1" stop-color="#fde7f1"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity=".6"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".6"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#f472b6" stroke-opacity=".08"/></pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .lbl { fill:#4a1d3a; font-size:13px; font-weight:600; }
      .sub { fill:#8b5a78; font-size:10px; }
      .node { fill:#ffffff; stroke:#f9a8d4; stroke-width:1.2; }
      .guard { stroke:#0891b2; }
      .agent { stroke:#8b5cf6; }
      .eval { stroke:#db2777; }
      .kb { stroke:#d97706; }
      .bus { stroke:#059669; }
      .wire { fill:none; stroke:url(#edge); stroke-width:1.6; stroke-dasharray:4 5; animation:flow 1.2s linear infinite; }
      .kbw { fill:none; stroke:#fbbf24; stroke-opacity:.55; stroke-width:1.4; stroke-dasharray:3 4; animation:flow 1.2s linear infinite; }
      .busw { fill:none; stroke:#34d399; stroke-opacity:.65; stroke-width:1.5; stroke-dasharray:4 4; animation:flow 1s linear infinite; }
      .tel { fill:none; stroke:#60a5fa; stroke-opacity:.35; stroke-width:1.2; stroke-dasharray:2 5; animation:flow 1.6s linear infinite; }
      .retry { fill:none; stroke:#f472b6; stroke-opacity:.75; stroke-width:1.5; stroke-dasharray:4 4; animation:flow 1s linear infinite; }
      @keyframes flow { to { stroke-dashoffset:-18; } }
      .pulse { animation:pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.2; } 50% { opacity:.85; } }
      .beat { animation:beat 1.8s ease-in-out infinite; }
      @keyframes beat { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      .blink { animation:blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity:0; } }
    </style>
  </defs>
  <rect width="1250" height="372" rx="16" fill="url(#bg)"/>
  <rect width="1250" height="372" rx="16" fill="url(#grid)"/>
  <text x="24" y="30" class="sub" style="font-size:11px">~/maryam $ kickoff --guardrails=in,out --evaluate --max-retries=3<tspan class="blink" fill="#22d3ee"> ▍</tspan></text>
  <path class="tel" d="M240,276 L240,300"/>
  <path class="tel" d="M548,168 L548,300"/>
  <path class="tel" d="M702,276 L702,300"/>
  <path class="tel" d="M856,168 L856,300"/>
  <path class="tel" d="M1010,168 L1010,300"/>
  <path id="e1" class="wire" d="M152,144 L174,144"/>
  <path id="e2" class="wire" d="M306,144 L328,144"/>
  <path id="e3" class="wire" d="M460,144 L482,144"/>
  <path id="e4" class="wire" d="M614,144 L636,144"/>
  <path id="e5" class="wire" d="M768,144 L790,144"/>
  <path id="e6" class="wire" d="M922,144 L944,144"/>
  <path id="e7" class="wire" d="M1076,144 L1098,144"/>
  <path id="ing" class="kbw" d="M410,168 C410,252 576,252 636,252"/>
  <text x="420" y="202" class="sub" fill="#b45309">embed files</text>
  <path id="rag" class="kbw" d="M702,228 L702,168"/>
  <text x="710" y="202" class="sub" fill="#b45309">retrieve</text>
  <path id="sb1" class="busw" d="M378,168 C378,252 336,252 306,252"/>
  <path id="sb2" class="busw" marker-end="url(#ahg)" d="M240,228 L240,170"/>
  <text x="232" y="202" text-anchor="end" class="sub" fill="#047857">status &amp; results</text>
  <path id="rt" class="retry" marker-end="url(#ah)" d="M856,120 C856,65 702,65 702,118"/>
  <text x="779" y="70" text-anchor="middle" class="sub" fill="#be185d">fail → retry (max 3)</text>
  <text x="933" y="108" text-anchor="middle" class="sub" fill="#047857">pass</text>

  <!-- nodes -->
  <rect x="20" y="120" width="132" height="48" rx="10" class="node"/>
  <text x="86" y="141" text-anchor="middle" class="lbl">input</text>
  <text x="86" y="157" text-anchor="middle" class="sub">text · files</text>
  <rect x="174" y="120" width="132" height="48" rx="10" class="node"/>
  <text x="240" y="141" text-anchor="middle" class="lbl">platform</text>
  <text x="240" y="157" text-anchor="middle" class="sub">kickoff form</text>
  <rect x="328" y="120" width="132" height="48" rx="10" class="node"/>
  <text x="394" y="141" text-anchor="middle" class="lbl">python use case</text>
  <text x="394" y="157" text-anchor="middle" class="sub">orchestration</text>
  <rect x="482" y="120" width="132" height="48" rx="10" class="node guard"/>
  <text x="548" y="141" text-anchor="middle" class="lbl">input guards</text>
  <text x="548" y="157" text-anchor="middle" class="sub">injection · secrets</text>
  <rect x="636" y="111" width="132" height="48" rx="10" class="node agent" opacity=".35"/>
  <rect x="636" y="115" width="132" height="48" rx="10" class="node agent" opacity=".6"/>
  <rect x="636" y="120" width="132" height="48" rx="10" class="node agent"/>
  <text x="702" y="141" text-anchor="middle" class="lbl">agents</text>
  <text x="702" y="157" text-anchor="middle" class="sub">process task</text>
  <rect x="784" y="114" width="144" height="60" rx="14" fill="none" stroke="#f472b6" stroke-width="2" class="pulse" filter="url(#glow)"/>
  <rect x="790" y="120" width="132" height="48" rx="10" class="node eval"/>
  <text x="856" y="141" text-anchor="middle" class="lbl">evaluator</text>
  <text x="856" y="157" text-anchor="middle" class="sub">checks vs rules</text>
  <rect x="944" y="120" width="132" height="48" rx="10" class="node guard"/>
  <text x="1010" y="141" text-anchor="middle" class="lbl">output guards</text>
  <text x="1010" y="157" text-anchor="middle" class="sub">toxicity · secrets</text>
  <rect x="1098" y="120" width="132" height="48" rx="10" class="node"/>
  <text x="1164" y="141" text-anchor="middle" class="lbl">output ✓</text>
  <text x="1164" y="157" text-anchor="middle" class="sub">validated response</text>
  <rect x="636" y="228" width="132" height="48" rx="10" class="node kb"/>
  <text x="702" y="249" text-anchor="middle" class="lbl">knowledge base</text>
  <text x="702" y="265" text-anchor="middle" class="sub">embeddings · search</text>
  <rect x="174" y="228" width="132" height="48" rx="10" class="node bus"/>
  <text x="240" y="249" text-anchor="middle" class="lbl">service bus</text>
  <text x="240" y="265" text-anchor="middle" class="sub">async messaging</text>
  <rect x="20" y="300" width="1210" height="34" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-opacity=".7" stroke-width="1.2"/>
  <circle cx="40" cy="317" r="4" fill="#60a5fa" class="beat" filter="url(#glow)"/>
  <text x="54" y="321" class="lbl" style="font-size:12px">app insights</text>
  <text x="160" y="321" class="sub">logs · traces · monitoring across every stage</text>

  <!-- travelling packets (8s cycle) -->
  <g filter="url(#glow)">
    <circle r="4" fill="#ec4899" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0001;0.05;1"><mpath href="#e1"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0001;0.05"/></circle>
    <circle r="4" fill="#ec4899" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.06;0.11;1"><mpath href="#e2"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.06;0.11"/></circle>
    <circle r="4" fill="#fbbf24" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.12;0.22;1"><mpath href="#ing"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.12;0.22"/></circle>
    <circle r="4" fill="#22d3ee" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.12;0.17;1"><mpath href="#e3"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.12;0.17"/></circle>
    <circle r="4" fill="#a78bfa" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.18;0.23;1"><mpath href="#e4"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.18;0.23"/></circle>
    <circle r="4" fill="#fbbf24" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="1;1;0;0" keyTimes="0;0.24;0.29;1"><mpath href="#rag"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.24;0.29"/></circle>
    <circle r="4" fill="#a78bfa" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.31;0.36;1"><mpath href="#e5"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.31;0.36"/></circle>
    <circle r="4" fill="#f472b6" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.38;0.47;1"><mpath href="#rt"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.38;0.47"/></circle>
    <circle r="4" fill="#a78bfa" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.49;0.54;1"><mpath href="#e5"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.49;0.54"/></circle>
    <circle r="4" fill="#34d399" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.57;0.62;1"><mpath href="#e6"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.57;0.62"/></circle>
    <circle r="4" fill="#22d3ee" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.64;0.69;1"><mpath href="#e7"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.64;0.69"/></circle>
    <circle r="4" fill="#34d399" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.72;0.82;1"><mpath href="#sb1"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.72;0.82"/></circle>
    <circle r="4" fill="#34d399" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.83;0.9;1"><mpath href="#sb2"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.83;0.9"/></circle>
  </g>

  <text x="1226" y="358" text-anchor="end" class="sub">guardrails in &amp; out · retrieval · evaluator loop (≤3 retries) · service bus · app insights</text>
</svg>
